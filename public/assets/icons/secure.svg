<svg xmlns="http://www.w3.org/2000/svg"
  width="64" height="64" viewBox="0 0 64 64" fill="none"
  role="img" aria-labelledby="title desc">
  <title id="title">Secure checkout</title>
  <desc id="desc">Elegant shield and lock icon representing a secure checkout.</desc>

  <g stroke="#6b4530" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Shield -->
    <path d="M32 8.5L48 14.5V28.6C48 39.4 41.5 48.9 32 54.5C22.5 48.9 16 39.4 16 28.6V14.5L32 8.5Z"/>

    <!-- Lock body -->
    <rect x="24.5" y="28" width="15" height="12.5" rx="2.5"/>
    <path d="M27.8 28V24.5C27.8 21.9 29.7 19.8 32 19.8C34.3 19.8 36.2 21.9 36.2 24.5V28"/>

    <!-- Keyhole -->
    <circle cx="32" cy="33.5" r="1.2"/>
    <path d="M32 34.7V37"/>

    <!-- Checkout/check accent -->
    <path d="M25.5 46.2L29 49.4L36.8 42.2"/>
  </g>
</svg>